[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"

# Arc testnet's explorer (testnet.arcscan.app) is Blockscout-based, verified via:
# forge verify-contract <address> <contract> --rpc-url arc_testnet --verifier blockscout --verifier-url https://testnet.arcscan.app/api/
[etherscan]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
